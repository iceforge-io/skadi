# Demo-only semantic JDBC direct execution mode.
# Do not use this as the final production semantic execution architecture.

skadi.semantic.demo.enabled=true
skadi.semantic.demo.execution-mode=jdbc-direct
skadi.semantic.demo.datasource-id=default
skadi.semantic.demo.max-rows=100
skadi.semantic.demo.query-timeout-ms=30000

# Example datasource shape. Align exact property names with existing SkadiJdbcProperties.
# Never commit real tokens.
skadi.jdbc.datasources.default.provider=default
skadi.jdbc.datasources.default.jdbc-url=jdbc:databricks://<workspace-host>:443/default;transportMode=http;ssl=1;httpPath=<warehouse-http-path>;AuthMech=3;
skadi.jdbc.datasources.default.username=token
skadi.jdbc.datasources.default.password=${DATABRICKS_TOKEN}

# Suggested actuator exposure for local smoke testing only.
management.endpoints.web.exposure.include=health,info,metrics,prometheus
