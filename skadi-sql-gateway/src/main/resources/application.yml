server:
  port: 8090

skadi:
  sql-gateway:
    # Config stub; will be used once the PG wire-protocol listener exists.
    advertised-host: localhost
    advertised-port: 8090

    pgwire:
      enabled: false
      host: 0.0.0.0
      port: 15432
      auth:
        mode: trust # trust | password
        # credential-store: plaintext  # plaintext (default) | bcrypt
        # users:
        #   alice: secret                     # plaintext example
        #   bob: $2a$12$...                   # bcrypt hash example
        # policies:
        #   alice:
        #     allowed-schemas: [sales, finance]
        #   bob:
        #     allowed-schemas: [sales]
        # (no policy entry = unrestricted)

      # Protect against accidental large scans.
      # If set, Skadi will call JDBC Statement#setMaxRows(maxRows) before executing.
      # max-rows: 100000

      # Hint to JDBC driver for streaming fetch.
      # If set, Skadi will call JDBC Statement#setFetchSize(fetchSize) before executing.
      # fetch-size: 1000

      # Per-query execution timeout. 0 or omit for no limit.
      # query-timeout: 5m

      # Maximum concurrent queries per authenticated user. 0 or omit for unlimited.
      # max-concurrent-queries-per-user: 10

    trace:
      enabled: false
      # testdata-path: testdata/tableau-traces

    cache:
      enabled: true
      ttl: 5m
      max-entries: 500

    databricks:
      enabled: false
      host: ""
      http-path: ""
      token: ""
      max-pool-size: 5
      connect-timeout: 10s
      query-timeout: 5m
      jdbc-properties: {}

# Timestamp/timezone behavior (POC):
# - Columns reported as JDBC TIMESTAMP are advertised as PostgreSQL TIMESTAMP (OID 1114).
# - Columns reported as JDBC TIMESTAMP_WITH_TIMEZONE are advertised as PostgreSQL TIMESTAMPTZ (OID 1184).
# - Values are currently sent in *text* format using Java's toString() for each cell.
#   If Tableau/JDBC requires ISO-8601 formatting, we'll normalize next.

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
